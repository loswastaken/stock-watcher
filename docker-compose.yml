services:
  stock-watcher:
    image: ghcr.io/loswastaken/stock-watcher:latest
    container_name: stock-watcher
    restart: unless-stopped
    ports:
      - "8095:8000"  # host:container — change the left side if 8095 is taken
    volumes:
      - /volume2/docker/stock-watcher/data:/data
    environment:
      TZ: America/New_York  # Change to your timezone
      COOKIE_SECURE: "true"  # Set to false only for plain HTTP on LAN
      # SECRET_KEY: ""  # Optional; otherwise generated and stored in /data/secret.key
    labels:
      com.centurylinklabs.watchtower.enable: "false"  # keep other Watchtowers away; updates are manual
    shm_size: 1gb  # Required for Chromium in Playwright
